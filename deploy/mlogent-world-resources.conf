# Install as /etc/systemd/system/mlogent-world.service.d/zz-resource-budget.conf.
# Budget for the existing 2-vCPU / 1.9-GiB host; covers proxy, daemon and JVM.
[Service]
CPUAccounting=yes
CPUQuota=100%
CPUShares=256
MemoryAccounting=yes
MemoryMax=700M
TasksAccounting=yes
TasksMax=256
Nice=5
OOMScoreAdjust=400
IOSchedulingClass=best-effort
IOSchedulingPriority=7
BlockIOAccounting=yes
BlockIOReadBandwidth=/dev/vda 20M
BlockIOWriteBandwidth=/dev/vda 10M
ExecStartPost=+/bin/sh /etc/mlogent/world-resource-budget.sh
